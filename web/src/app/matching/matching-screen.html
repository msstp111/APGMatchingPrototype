<!--
  Every value on this screen is read straight off the DTO. Nothing in this template or the ones below
  it subtracts, sums, compares or formats a date: those answers arrive already computed, and working
  one out again here is the drift the whole architecture exists to prevent.

  Two exceptions exist and are named in no-domain-arithmetic.spec.ts: the fill meter's CSS widths and
  the band header's roll-up totals.
-->
<div class="matching-screen">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <!--
    Reserved for Phase 4's shared search field. Held open at 52px because the card density this design
    is calculated against assumes it, and empty rather than filled with a dead control.
  -->
  <div class="search-strip" aria-hidden="true"></div>

  @if (ready()) {
    <div class="columns">
      <app-matching-column side="demand" [bands]="board().bands" />
      <app-matching-column side="supply" [bands]="board().bands" />
    </div>
  }
</div>
