<!--
  design-system.md 11.6: exactly three reasons and nothing else. The warning panel that used to sit
  under them is gone (2026-09-08) — the dialog states the ask and the reasons, and the consequences of
  a cancellation belong in the walkthrough, not in the way of every cancellation.
-->
<!-- The title carries the ask. With a reason required and nothing preselected, the title is the
     instruction, so the radio group needs no separate prompt beside it. -->
<h2 mat-dialog-title>Select reason for cancellation</h2>

<mat-dialog-content>
  <p class="lede">
    {{ data.match.quantityMatched }} head, {{ data.match.processor }} {{ data.match.plant }},
    {{ data.match.locationName || 'no location' }}.
  </p>

  <mat-radio-group class="reasons" [ngModel]="reason()" (ngModelChange)="reason.set($event)">
    @for (option of reasons; track option.value) {
      <mat-radio-button [value]="option.value">{{ option.label }}</mat-radio-button>
    }
  </mat-radio-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close type="button">Keep match</button>

  <button
    matButton="filled"
    class="destructive"
    type="button"
    [disabled]="reason() === null"
    (click)="cancelMatch()"
  >
    Cancel match
  </button>
</mat-dialog-actions>
