<!--
  One line: carry glyph · tile · location · stock class · "since 17 Aug" · meter · chevron.

  The origin label is the record's own availableFromShortLabel with the word "since" in front. The date
  is formatted in C# and the word is template text, because the two need to be separable and neither
  should be assembled from an ISO string here.

  The expansion below is the SAME component the full card uses, so a carry-over shows the same fields,
  the same sums and the same match rows. There is no reduced variant to fall out of step.
-->
<div class="crow" [class.cancelled]="isCancelled()">
  <span class="spine" [class]="spine()"></span>

  <div class="cbody">
    <span class="material-symbols-outlined carry-glyph" aria-hidden="true">keyboard_return</span>
    <app-stock-class-tile [stockClass]="record().stockClass" />
    <span class="name" [title]="record().locationName || '-'">{{ record().locationName || '-' }}</span>
    <span class="sclass" [title]="record().stockClass">{{ record().stockClass }}</span>
    <span class="origin">since {{ record().availableFromShortLabel }}</span>

    <app-fill-meter
      [original]="record().quantityAvailable"
      [matchedInclDraft]="record().matchedInclDraft"
      [matchedExclDraft]="record().matchedExclDraft"
      [unmatched]="record().unmatched"
      [quantityState]="record().quantityState"
      [quantityStateLabel]="record().quantityStateLabel"
      side="supply"
    />
  </div>

  <button
    matIconButton
    class="chev"
    type="button"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="expanded() ? 'Collapse' : 'Expand'"
    (click)="toggle()"
  >
    <span class="material-symbols-outlined">{{ expanded() ? 'expand_less' : 'expand_more' }}</span>
  </button>
</div>

@if (expanded()) {
  <app-card-expansion side="supply" [availability]="record()" />
}
