<!--
  Every value on this screen is read straight off the DTO. Nothing in this template or the ones below
  it subtracts, sums, compares or formats a date: those answers arrive already computed, and working
  one out again here is the drift the whole architecture exists to prevent.

  Two exceptions exist and are named in no-domain-arithmetic.spec.ts: the fill meter's CSS widths and
  the band header's roll-up totals.

  There is no shared search strip. design-system.md 12.1 specified one; the per-column filter rows
  cover it, and the 52px it would have taken went back to the list (Phase 4).
-->
<div class="matching-screen">
  <!--
    Four states, and exactly one of them is on screen at a time (requirement 4.1, design-system.md 13).
    Each names what has happened rather than leaving a blank content area to be interpreted.

    The chain is deliberate: an error outranks everything. The three reads land independently, so a
    week-bands call that succeeds while the spaces call fails would otherwise draw the error panel
    ABOVE a column that looks populated and says nothing about the half that is missing — which is
    worse than either state alone, because it invites the operator to trust what is on screen. One
    failure means one message, and Try again re-issues all three.
  -->
  @if (error()) {
    <div class="state error" role="alert">
      <span class="material-symbols-outlined glyph" aria-hidden="true">cloud_off</span>
      <p class="headline">{{ error() }}</p>
      <p class="prose">
        Nothing has been lost. Start the API with <code>dotnet run --project src/Apg.Api</code>, or
        <code>\dev.ps1</code> from the repository root, and try again.
      </p>
      <button type="button" class="retry" (click)="retry()">Try again</button>
    </div>
  } @else if (loading()) {
    <div class="state loading" aria-live="polite">
      <span class="material-symbols-outlined glyph spin" aria-hidden="true">progress_activity</span>
      <p class="headline">Loading processor spaces and livestock availability…</p>
    </div>
  } @else if (ready()) {
    <div class="columns" cdkDropListGroup [class.flipped]="flipped()">
      <!--
        Each column gets its own trimmed run of bands, so each starts at the week of its own earliest
        surviving record — recomputed whenever a filter changes which record that is. The two often
        differ, and their rails will show different weeks at the same height. That is correct: the
        columns scroll independently and neither may be trimmed by the other's data.

        The order is CSS, so flipping never destroys a column: no filter, sort or expanded card is
        lost across it (requirement 5.2). cdkDropListGroup connects every card drop list so a drag
        from one column can land on a card in the other without an id list to keep in sync.
      -->
      <app-matching-column
        class="demand"
        side="demand"
        [bands]="board().demand"
        [spaces]="spaces()"
        [total]="spaces().length"
      />

      <button
        type="button"
        class="flip"
        (click)="toggleFlip()"
        [attr.aria-label]="
          flipped() ? 'Put Processor Spaces on the left' : 'Put Livestock Availability on the left'
        "
        title="Swap the columns"
      >
        <span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span>
      </button>

      <app-matching-column
        class="supply"
        side="supply"
        [bands]="board().supply"
        [availability]="availability()"
        [total]="availability().length"
      />
    </div>
  }
</div>
