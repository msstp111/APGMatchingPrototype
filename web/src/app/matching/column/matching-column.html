<!--
  The column header, the reserved filter row and the sticky micro-cap strip are all OUTSIDE the
  scrolling list, except the strip, which is inside it and sticky at top: 0 so it survives scrolling.
  The strip's cells use the same widths as the cards, from _card-geometry.scss.
-->
<section class="column" [class.supply]="!isDemand()">
  <header class="chead">
    <span class="material-symbols-outlined glyph">{{ glyph() }}</span>
    <h2 class="ctitle">{{ title() }}</h2>
    <span class="showing">showing {{ shown() | number }} of {{ totalCount() | number }}</span>
  </header>

  <!--
    Reserved for Phase 4's filter chips and sort control. Held open rather than removed so the card
    density this design is calculated against does not change when the controls arrive; left empty
    rather than filled with disabled controls, which would promise an interaction that does not exist.
  -->
  <div class="filters" aria-hidden="true"></div>

  <div class="list">
    <div class="strip">
      <span class="s-tile"></span>
      <span class="s-name">{{ isDemand() ? 'Processor' : 'Location' }}</span>
      <span class="s-sclass">Stock class</span>
      <span class="s-date">{{ isDemand() ? 'Delivery' : 'From' }}</span>
      <span class="s-qty">{{ isDemand() ? 'Req' : 'Avail' }}</span>
      <span class="s-meter">Unmatched</span>
      <span class="s-chev"></span>
    </div>

    <!--
      Every band renders, including the empty ones. A missing band would make two weeks look adjacent
      when they are not (requirement 1.6).
    -->
    @for (band of bands(); track band.week.weekCommencing) {
      <app-week-band [band]="band" [side]="side()" />
    }
  </div>
</section>
