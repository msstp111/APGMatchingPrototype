<!--
  Both segments start at the left edge and the solid one is drawn OVER the alpha one, so the visible
  alpha band is exactly the draft delta.
-->
<div class="meter" [class]="rampClass()" [class.over]="isOver()" [title]="hoverTitle()">
  <div class="track">
    <div class="seg incl" [style.width]="inclWidth()"></div>
    <div class="seg excl" [style.width]="exactWidth()"></div>
    <!--
      What the drop in flight would add, hatched so it cannot be mistaken for a fill that exists.
      Petrol, not a ramp colour: it is the gesture speaking, not the record.
    -->
    @if (hasGhost()) {
      <div class="ghost" [style.left]="ghostLeft()" [style.width]="ghostWidth()"></div>
    }

    @if (isOver()) {
      <div class="over-run"></div>
    }
  </div>

  <!--
    The DTO's unmatchedLabel: the MAGNITUDE, printed as given. `9`, not `-9` — the over state is
    already carried by this meter's ink, by the over-run cap beside the track and by the word on the
    card's line 2, and a minus was a fourth statement of it inside a 40px column. The signed figure
    is in the hover string above, where a sentence has room for it.
  -->
  <span class="numeral">{{ unmatchedLabel() }}</span>
</div>
