<header class="top-bar">
  <button type="button" class="hamburger" aria-label="Toggle navigation" (click)="toggleSidebar.emit()">
    <span class="material-symbols-outlined">menu</span>
  </button>

  <span class="wordmark">LMS</span>

  <span class="spacer"></span>

  <!--
    design-system.md 14's debug treatment, in the one variant that works on petrol: a 26px stroked
    button, white text and a white ring rather than petrol-on-white, because petrol-on-petrol reads as
    nothing at all. It sits immediately left of the dev flag on purpose — that flag already means
    "this is not the real thing" in this application, and a demo-data control inherits the reading for
    free instead of having to argue for it.

    It is in the shell rather than on the matching screen so it costs the 596px list nothing
    (design-system.md 8.3) and is reachable from any screen a later pass adds.
  -->
  <button type="button" class="demo-reset" (click)="resetDemoData()"
          title="Demo tool: drops the database and re-seeds it. Everything drafted, edited or filtered is lost.">
    <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
    Reset demo data
  </button>

  <!--
    "Filter on drag" (Phase 10). A toggle, not an action, and it says which it is by staying filled
    while it is on: the two states have to be readable at a glance from across a room during a demo,
    and a control whose only difference is its wording is not.

    It is in the top bar beside the reset because it governs BOTH columns — one switch for both
    directions of the drag — so it belongs to neither column's filter row, and because it is a
    standing preference rather than something to be set mid-gesture. It is not debug scaffolding, and
    is deliberately not marked as such: unlike the reset and the + Add buttons, this is a real feature
    of the screen.
  -->
  <button
    type="button"
    class="pref-toggle drag-filter"
    [class.on]="filterOnDrag()"
    [attr.aria-pressed]="filterOnDrag()"
    (click)="toggleFilterOnDrag()"
    [title]="filterTitle()"
  >
    <span class="material-symbols-outlined" aria-hidden="true">{{
      filterOnDrag() ? 'filter_alt' : 'filter_alt_off'
    }}</span>
    Filter on drag
  </button>

  <!--
    "Drag anywhere" (2026-09-09). Its peer in every respect — same shape, same filled ON state, same
    store — and independent of it: either, neither or both.

    On, the ~478px between the grip and the chevron drags as well as expands; off, the row is exactly
    what it has been since 2026-09-07 and the grip is the only way to start a drag. It is a toggle
    rather than a straight change because the gesture it restores is the one that was taken off the
    card for a reason (a click that drifted lifted it), and because the two or three people who run
    this screen should be able to put it back the moment it gets in the way.
  -->
  <!--
    A COMPOUND CONTROL (2026-09-10), not two buttons. The main half switches the gesture on; the
    18px half on its trailing edge decides whether the cards keep their grips once it is on.

    They are folded into one control because they are one decision with a rider — "drag from the
    row, and (since you can) drop the glyph that used to be the only way". Two separate chrome
    buttons would have put a control in the bar that is inert most of the time, which is exactly
    the odd experience a disabled top-bar button produces.

    A <button> cannot contain a <button>, so the shell is a div with role="group" and the two real
    buttons sit inside it. The .pref-toggle shape is unchanged — this is still one 26px chrome
    control on the bar, and `.on` is still the one definition of the filled state.
  -->
  <div class="pref-toggle compound" role="group" aria-label="Drag anywhere" [class.on]="dragAnywhere()">
    <button
      type="button"
      class="main"
      [attr.aria-pressed]="dragAnywhere()"
      (click)="toggleDragAnywhere()"
      [title]="dragAnywhereTitle()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{
        dragAnywhere() ? 'drag_pan' : 'drag_indicator'
      }}</span>
      Drag anywhere
    </button>

    <!--
      Grips on or off, and it is only live while the gesture beside it is. Disabled rather than
      hidden: a control that appears and disappears as its neighbour is pressed is harder to find
      than one that greys, and its title says why it is grey.

      The tooltip is shown EXPLICITLY on click, because the state it reports changes under a pointer
      that is already resting on the button — and a `title` will not re-appear without the pointer
      moving away and back. It is the only feedback the press has: the cards it changes are in the
      list below, and the operator is looking at the top bar.
    -->
    <button
      type="button"
      class="sub"
      #gripTip="matTooltip"
      [matTooltip]="keepGripsTitle()"
      matTooltipPosition="below"
      [class.on]="keepGrips()"
      [disabled]="!dragAnywhere()"
      [attr.aria-pressed]="keepGrips()"
      aria-label="Keep drag grips on the cards"
      [title]="dragAnywhere() ? '' : 'Turn on Drag anywhere to hide the cards’ grips'"
      (click)="toggleKeepGrips(gripTip)"
    >
      <span class="material-symbols-outlined" aria-hidden="true">drag_indicator</span>
    </button>
  </div>

  <span class="dev-flag"># DEV ENVIRONMENT #</span>
</header>
